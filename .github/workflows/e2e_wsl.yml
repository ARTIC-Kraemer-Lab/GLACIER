name: End-to-end tests (Windows WSL)

on:
  workflow_call:
  workflow_dispatch:

jobs:
  e2e-tests-win:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Setup WSL
        shell: pwsh
        run: ./scripts/wsl-setup.ps1
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      # npm's allowScripts policy skips dependency lifecycle scripts, so the
      # Electron binary is installed explicitly.
      - name: Install Electron binary
        run: node scripts/install-electron.mjs
      - name: Verify Electron binary
        shell: bash
        run: |
          node -e "const fs=require('fs'),path=require('path');const d='node_modules/electron';const t=path.join(d,'path.txt');if(!fs.existsSync(t))throw new Error('Electron path.txt missing at '+t);const b=path.join(d,'dist',fs.readFileSync(t,'utf8').trim());if(!fs.existsSync(b))throw new Error('Electron binary missing at '+b);console.log('Electron binary at '+b)"
      - name: Platform specific CI setup
        run: ./tests/e2e/ci-setup.sh
      - name: Build GLACIER
        run: npm run build
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-windows-wsl
          path: |
            playwright-report/
            test-results/
          retention-days: 7
