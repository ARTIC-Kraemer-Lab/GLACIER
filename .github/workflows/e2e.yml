name: End-to-end tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  e2e-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      # Local nextflow install is required for WebServer testing
      - uses: nf-core/setup-nextflow@v1

      # A stripped Tumurin JRE is bundled with GLACIER
      - name: Install Temurin JAVA
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      # npm's allowScripts policy skips dependency lifecycle scripts, so the
      # Electron binary is installed explicitly.
      - name: Install Electron binary
        run: node scripts/install-electron.mjs
      - name: Verify Electron binary
        shell: bash
        run: |
          node -e "const fs=require('fs'),path=require('path');const d='node_modules/electron';const t=path.join(d,'path.txt');if(!fs.existsSync(t))throw new Error('Electron path.txt missing at '+t);const b=path.join(d,'dist',fs.readFileSync(t,'utf8').trim());if(!fs.existsSync(b))throw new Error('Electron binary missing at '+b);console.log('Electron binary at '+b)"
      - name: Platform specific CI setup
        run: ./tests/e2e/ci-setup.sh
      - name: Build GLACIER
        run: npm run build
      - name: Run Playwright tests
        run: npx playwright test
      # Always upload, so a cancelled/timed out run still leaves traces and reports
      # behind for debugging.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
